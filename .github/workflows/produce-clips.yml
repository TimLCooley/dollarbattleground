# Video producer. Drafts are timing placeholders: the autopilot queues a video
# card per team per day, and this job renders each one from live data shortly
# before its slot (checked every 30 minutes; GitHub's cron can run late, and
# the autopilot waits up to 90 minutes for a clip before posting as text).
# Runs here because Remotion needs Chromium, which Vercel can't provide.
# Spend is capped by the HeyGen wallet guard inside scripts/produce-clip.mjs.
name: Produce field-report clips

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "due (render placeholders) | red | blue | founder | cast (list HeyGen ids)"
        default: "due"
      kind:
        description: "for red/blue: field | recruit"
        default: "recruit"
      force:
        description: "Ignore the mix / dedupe / unchanged-map skips (1 = yes)"
        default: ""

concurrency: produce-clips

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      FORCE: ${{ github.event.inputs.force }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx remotion browser ensure
      - name: ffmpeg (clips are trimmed to the last word)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && ffprobe -version | head -1
      - name: Render video placeholders due in the next 2 hours
        if: ${{ github.event_name == 'schedule' || github.event.inputs.mode == 'due' || github.event.inputs.mode == '' }}
        run: node scripts/produce-clip.mjs due
      - name: Manual clip
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'red' || github.event.inputs.mode == 'blue' || github.event.inputs.mode == 'founder') }}
        run: node scripts/produce-clip.mjs ${{ github.event.inputs.mode }} ${{ github.event.inputs.kind }}
      - name: HeyGen roster
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'cast' }}
        run: node scripts/produce-clip.mjs cast
